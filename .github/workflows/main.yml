name: Main

permissions:
    contents: read

on:
    push:
        branches: [main]
    schedule:
        - cron: "0 8,20 * * *"

jobs:
    unit-tests:
        name: Unit tests
        uses: apple/swift-nio/.github/workflows/unit_tests.yml@main
        with:
            linux_5_10_arguments_override: "--explicit-target-dependency-import-check error -Xswiftc -warnings-as-errors"
            linux_6_0_arguments_override: "--explicit-target-dependency-import-check error -Xswiftc -warnings-as-errors"
            linux_6_1_arguments_override: "--explicit-target-dependency-import-check error -Xswiftc -warnings-as-errors"
            linux_6_2_arguments_override: "--explicit-target-dependency-import-check error -Xswiftc -warnings-as-errors"
            linux_nightly_next_arguments_override: "--explicit-target-dependency-import-check error"
            linux_nightly_main_arguments_override: "--explicit-target-dependency-import-check error"

    static-sdk:
        name: Static SDK
        # Workaround https://github.com/nektos/act/issues/1875
        uses: apple/swift-nio/.github/workflows/static_sdk.yml@main

    release-builds:
        name: Release builds
        uses: apple/swift-nio/.github/workflows/release_builds.yml@main

    construct-benchmarks-matrix:
        name: Construct benchmarks matrix
        runs-on: ubuntu-latest
        outputs:
            benchmarks-matrix: '${{ steps.generate-matrix.outputs.benchmarks-matrix }}'
        steps:
            - name: Checkout repository
              uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - id: generate-matrix
              run: echo "benchmarks-matrix=$(curl -s https://raw.githubusercontent.com/apple/swift-nio/main/scripts/generate_matrix.sh | bash)" >> "$GITHUB_OUTPUT"
              env:
                  MATRIX_LINUX_SETUP_COMMAND: apt-get update -y -q && apt-get install -y -q libjemalloc-dev && git config --global --add safe.directory /async-http-client
                  MATRIX_LINUX_COMMAND: ./Benchmarks/scripts/check-thresholds.sh
                  # The benchmark server needs Swift 6.4.
                  MATRIX_LINUX_6_2_ENABLED: false
                  MATRIX_LINUX_6_3_ENABLED: false

    benchmarks:
        name: Benchmarks
        needs: construct-benchmarks-matrix
        uses: apple/swift-nio/.github/workflows/swift_test_matrix.yml@main
        with:
            name: "Benchmarks"
            matrix_string: '${{ needs.construct-benchmarks-matrix.outputs.benchmarks-matrix }}'
